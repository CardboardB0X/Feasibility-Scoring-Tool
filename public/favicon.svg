<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="appleBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997ff"/>
      <stop offset="100%" stop-color="#0071e3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Apple squircle background -->
  <rect width="512" height="512" rx="128" fill="url(#appleBlue)"/>

  <!-- Minimalist Scale & Shield Icon -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <!-- Central Pillar -->
    <line x1="256" y1="120" x2="256" y2="400" />
    <line x1="180" y1="400" x2="332" y2="400" stroke-width="28" />

    <!-- Fulcrum Top -->
    <circle cx="256" cy="120" r="16" fill="#ffffff" />

    <!-- Crossbar -->
    <line x1="120" y1="180" x2="392" y2="180" stroke-width="24" />

    <!-- Left Pan -->
    <line x1="120" y1="180" x2="80" y2="280" stroke-width="16" />
    <line x1="120" y1="180" x2="160" y2="280" stroke-width="16" />
    <path d="M 64 280 Q 120 320 176 280 Z" fill="#ffffff" fill-opacity="0.3" stroke-width="20" />

    <!-- Right Pan -->
    <line x1="392" y1="180" x2="352" y2="280" stroke-width="16" />
    <line x1="392" y1="180" x2="432" y2="280" stroke-width="16" />
    <path d="M 336 280 Q 392 320 448 280 Z" fill="#ffffff" fill-opacity="0.3" stroke-width="20" />
  </g>
</svg>
